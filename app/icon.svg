<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Friend Archive — two friends as interlocking rings, one in ink and
       one in gold. Same mark as the header lockup (components/layout/Wordmark),
       on a plate, because a favicon has to survive on somebody else's
       background. The diamond that used to sit in the overlap is gone: at 16px
       it was a third detail competing with the two that carry the meaning.
       Geometry: r 13.5, stroke 4.5, centres (24,32) and (40,32) — symmetric,
       8.25 from each edge. The rings weave: the gold crosses in front at the
       top, and the final arc repaints the ink ring in front at the bottom.
       Colours are the app's own (--color-text-primary / --color-accent). -->
  <rect width="64" height="64" rx="13" fill="#0b0b0f"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.25" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="24" cy="32" r="13.5" fill="none" stroke="#f5f5f5" stroke-width="4.5"/>
  <circle cx="40" cy="32" r="13.5" fill="none" stroke="#f5b400" stroke-width="4.5"/>
  <path d="M35.06 39.74 A13.5 13.5 0 0 1 27.49 45.04" fill="none" stroke="#f5f5f5" stroke-width="4.5" stroke-linecap="round"/>
</svg>
