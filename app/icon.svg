<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Friend Archive — two friends as interlocking rings, one in ink and
       one in the accent blue. Same mark as the header lockup (components/layout/Wordmark),
       on a plate, because a favicon has to survive on somebody else's
       background. The rings weave: the blue crosses in front at the top, and
       the final arc repaints the ink ring in front at the bottom.
       Geometry: r 13.5, stroke 4.5, centres (24,32) and (40,32), the pair
       turned 30° about the plate's centre.
       Shading is the iOS kind: a plate lit from above (gradient + top sheen +
       hairline highlight), rings with a top-to-bottom gradient and a soft
       drop shadow. Gradients are counter-rotated so the light stays on top.
       PNG icons are rendered from this file: scripts/render-icons.mjs. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23232b"/>
      <stop offset="1" stop-color="#060609"/>
    </linearGradient>
    <radialGradient id="sheen" cx="32" cy="-6" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="16" x2="0" y2="48" gradientUnits="userSpaceOnUse" gradientTransform="rotate(-30 32 32)">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c9d1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="16" x2="0" y2="48" gradientUnits="userSpaceOnUse" gradientTransform="rotate(-30 32 32)">
      <stop offset="0" stop-color="#6cc4ff"/>
      <stop offset="1" stop-color="#1673e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <rect width="64" height="64" rx="14" fill="url(#sheen)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="url(#rim)"/>
  <g filter="url(#shadow)">
    <g transform="rotate(30 32 32)" fill="none" stroke-width="4.5">
      <circle cx="24" cy="32" r="13.5" stroke="url(#ink)"/>
      <circle cx="40" cy="32" r="13.5" stroke="url(#accent)"/>
      <path d="M35.06 39.74 A13.5 13.5 0 0 1 27.49 45.04" stroke="url(#ink)" stroke-linecap="round"/>
    </g>
  </g>
</svg>
